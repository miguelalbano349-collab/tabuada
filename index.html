<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada Interativo</title>

    <style>
        /* Configurações gerais */
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Caixa principal */
        .container {
            background-color: #000000;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ffffff;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        /* Título */
        h1 {
            color: #ffffff;
            font-size: 25px;
            margin-bottom: 25px;
        }

        /* Texto de orientação */
        label {
            display: block;
            margin-bottom: 10px;
            color: #ffffff;
        }

        /* Campo de entrada */
        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #ffffff;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background-color: #000000;
            color: #ffffff;
        }

        /* Botão */
        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        /* Efeito do botão */
        button:hover {
            background-color: #cccccc;
        }

        /* Área dos resultados */
        #resultado {
            margin-top: 20px;
            text-align: left;
            line-height: 1.8;
            color: #ffffff;
        }

        /* Título da tabuada */
        #resultado h2 {
            text-align: center;
            color: #ffffff;
        }

        /* Linhas da tabuada */
        #resultado p {
            background-color: #000000;
            color: #ffffff;
            padding: 8px;
            border: 1px solid #444444;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Gerador de Tabuada Interativo</h1>

        <label for="numero">
            Digite um número entre 1 e 10:
        </label>

        <input
            type="number"
            id="numero"
            min="1"
            max="10"
            placeholder="Digite um número"
        >

        <button onclick="gerarTabuada()">
            Gerar Tabuada
        </button>

        <div id="resultado"></div>

    </div>

    <script>
        // Função para gerar a tabuada
        function gerarTabuada() {

            const numero = Number(
                document.getElementById("numero").value
            );

            const resultado = document.getElementById("resultado");

            resultado.innerHTML = "";

            // Validar o número informado
            if (
                !Number.isInteger(numero) ||
                numero < 1 ||
                numero > 10
            ) {
                resultado.innerHTML =
                    "<p>Digite um número inteiro entre 1 e 10.</p>";

                return;
            }

            // Criar o título da tabuada
            let conteudo = `<h2>Tabuada do ${numero}</h2>`;

            // Estrutura de repetição FOR
            for (let i = 1; i <= 10; i++) {

                let multiplicacao = numero * i;

                conteudo += `<p>${numero} x ${i} = ${multiplicacao}</p>`;
            }

            // Exibir os resultados na página
            resultado.innerHTML = conteudo;
        }
    </script>

</body>
</html>
