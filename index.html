
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada Interativo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #000;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #fff;
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 6px;
        }

        button {
            background: #fff;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #resultado {
            margin-top: 20px;
            line-height: 1.8;
            text-align: left;
        }

        #resultado h2 {
            text-align: center;
        }

        #resultado p {
            padding: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Gerador de Tabuada Interativo</h1>

        <label for="numero">
            Digite um número entre 1 e 10:
        </label>

        <input type="number" id="numero"
               min="1" max="10"
               placeholder="Digite um número">

        <button onclick="gerarTabuada()">
            Gerar Tabuada
        </button>

        <div id="resultado"></div>
    </div>

    <script>
        function gerarTabuada() {
            const numero = Number(
                document.getElementById("numero").value
            );

            const resultado =
                document.getElementById("resultado");

            resultado.innerHTML = "";

            if (!Number.isInteger(numero) ||
                numero < 1 || numero > 10) {
                resultado.innerHTML =
                    "<p>Digite um número inteiro entre 1 e 10.</p>";
                return;
            }

            let conteudo = `<h2>Tabuada do ${numero}</h2>`;

            for (let i = 1; i <= 10; i++) {
                let multiplicacao = numero * i;
                conteudo += `<p>${numero} x ${i} = ${multiplicacao}</p>`;
            }

            resultado.innerHTML = conteudo;
        }
    </script>

</body>
</html>
